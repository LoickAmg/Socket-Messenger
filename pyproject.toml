[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socket-messenger"
version = "0.1.0"
description = "Messagerie TCP multi-client avec découverte UDP, construite avec le module socket de Python."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Project roadmap" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
